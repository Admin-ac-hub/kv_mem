name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.build_type }} / vector=${{ matrix.vector }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Debug, Release]
        vector: ['OFF', 'ON']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_TESTING=ON
          -DKV_ENABLE_VECTOR_EXTENSION=${{ matrix.vector }}
          -DKV_ENABLE_RECALL_REGRESSION=${{ matrix.vector == 'ON' && matrix.build_type == 'Release' && 'ON' || 'OFF' }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: >-
          ctest --test-dir build
          --build-config ${{ matrix.build_type }}
          --no-tests=error
          --output-on-failure

  sanitizers:
    name: ${{ matrix.platform.name }} / vector=${{ matrix.vector }}
    strategy:
      fail-fast: false
      matrix:
        vector: ['OFF', 'ON']
        platform:
          - name: Ubuntu / ASan+UBSan
            os: ubuntu-latest
            sanitizers: address,undefined
            compiler: clang++
          - name: macOS / ASan+UBSan
            os: macos-latest
            sanitizers: address,undefined
            compiler: clang++
          - name: Ubuntu / TSan
            os: ubuntu-latest
            sanitizers: thread
            compiler: clang++
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 30
    env:
      ASAN_OPTIONS: halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=${{ matrix.platform.compiler }}
          -DBUILD_TESTING=ON
          -DKV_ENABLE_VECTOR_EXTENSION=${{ matrix.vector }}
          -DKV_SANITIZERS=${{ matrix.platform.sanitizers }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: >-
          ctest --test-dir build
          --build-config Debug
          --no-tests=error
          --output-on-failure
